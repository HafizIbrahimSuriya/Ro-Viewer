<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ro-Viewer</title><link rel="icon" type="image/png" href="logo.png">
<style>
:root{color-scheme:light;--bg:#f2f4f5;--panel:#fff;--ink:#1c1e21;--mut:#5f6c7b;--g:#335fff;--gd:#2548d6;--tint:#e8eeff;--line:#e3e7ec;--bad:#d93a3a;--warn:#b26a00;--ok:#1fa855;--hd:#fff;--sh:0 1px 3px rgba(20,40,80,.08),0 6px 18px rgba(20,40,80,.05)}
[data-theme=dark]{color-scheme:dark;--bg:#0d1017;--panel:#161a23;--ink:#e8ecf3;--mut:#8e9ab0;--g:#4f7bff;--gd:#8fb0ff;--tint:#1a2342;--line:#252b38;--bad:#ff6b6b;--warn:#ffb74d;--ok:#3ddc84;--hd:#121620;--sh:0 1px 2px rgba(0,0,0,.6),0 8px 24px rgba(0,0,0,.35)}
[data-theme=dark] body{background:radial-gradient(900px 380px at 50% -140px,#1b2a63 0,transparent 70%) no-repeat,var(--bg)}[data-theme=dark] input,[data-theme=dark] select{background:#0f131b}[data-theme=dark] .ft,[data-theme=dark] .chip{background:#0f131b}[data-theme=dark] .panel:hover,[data-theme=dark] .it:hover{border-color:#34406a}[data-theme=dark] .top img{border-color:#2c3550}[data-theme=dark] #dr{box-shadow:-10px 0 40px rgba(0,0,0,.6)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Segoe UI',system-ui,-apple-system,sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:18px;padding:0 24px;height:60px;background:var(--hd);border-bottom:1px solid var(--line);box-shadow:var(--sh)}
header h1{margin:0;font-size:21px;font-weight:800;display:flex;align-items:center;gap:10px;color:var(--ink)}.lgi{height:30px;width:auto}.chk{display:flex;align-items:center;gap:10px;margin-top:12px;cursor:pointer;font-size:13.5px}.chk input{width:18px;height:18px;flex:none;padding:0;accent-color:var(--g)}.foot{text-align:center;color:var(--mut);font-size:13px;padding:18px 0 30px}.foot a{color:var(--gd)}
.lg{width:28px;height:28px;border-radius:7px;background:var(--g);position:relative;transform:rotate(-12deg)}.lg:after{content:"";position:absolute;inset:8px;background:var(--hd);border-radius:2px}
header nav{display:flex;gap:2px;flex:1;height:100%}header nav button{background:none;color:var(--mut);border:0;border-bottom:3px solid transparent;padding:0 16px;cursor:pointer;font:inherit;font-weight:600}header nav button:hover{color:var(--ink)}header nav button.on{color:var(--g);border-bottom-color:var(--g)}
#th{background:var(--tint);color:var(--gd);border:0;padding:8px 14px;border-radius:99px;cursor:pointer;font:inherit;font-weight:600}
main{max-width:1120px;margin:0 auto;padding:22px 18px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--sh)}
input,select{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--ink)}input:focus,select:focus{border-color:var(--g)}
.b{font:inherit;font-weight:600;padding:9px 16px;border:0;border-radius:9px;background:var(--g);color:#fff;cursor:pointer}.b.o{background:var(--panel);color:var(--gd);border:1px solid var(--line)}.b:hover{filter:brightness(1.1)}.b.o:hover{background:var(--tint)}
:focus-visible{outline:2px solid var(--g);outline-offset:2px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>input{flex:1;min-width:160px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;margin-top:16px}.card{display:flex;flex-direction:column;gap:10px;transition:transform .15s}.card:hover{transform:translateY(-2px)}
.top{display:flex;gap:12px;align-items:center}.top img{width:64px;height:64px;border-radius:50%;background:var(--tint);border:2px solid var(--line)}.top>div{flex:1;min-width:0}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12.5px;font-weight:600;background:var(--tint);color:var(--gd);margin:2px 4px 2px 0}.pill.bad{background:var(--bad);color:#fff}.pill.on{background:var(--ok);color:#fff}
.mut{color:var(--mut)}.bad{color:var(--bad)}.sm{font-size:13px}.bio{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;color:var(--mut);white-space:pre-wrap}
.chip{display:inline-block;padding:3px 10px;margin:2px;border-radius:99px;border:1px solid var(--line);font-size:13px;background:var(--bg)}a{color:var(--gd)}
.kv{display:grid;grid-template-columns:110px 1fr;gap:3px 8px;font-size:14px}.kv span:nth-child(odd){color:var(--mut)}
#dr{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--bg);border-left:1px solid var(--line);box-shadow:-8px 0 30px rgba(0,0,0,.15);z-index:9;transform:translateX(100%);transition:transform .2s;overflow:auto;padding:0}#dr.open{transform:none}
.tabs{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;margin:12px 0;padding-bottom:4px;scrollbar-width:thin}.tabs button{flex:none;white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 14px;border-radius:99px;cursor:pointer;font:inherit}.tabs button.on{background:var(--g);color:#fff;border-color:var(--g)}
table{width:100%;border-collapse:collapse}td,th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
.note{border-left:4px solid var(--g);padding:8px 12px;background:var(--tint);margin:10px 0;font-size:13.5px;border-radius:0 8px 8px 0}.alert{border-left:4px solid var(--bad);padding:10px 14px;margin:10px 0;background:var(--panel);border-radius:8px;box-shadow:var(--sh)}
.chain{padding:10px 0;border-bottom:1px solid var(--line)}#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:20}#toast div{background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;margin-top:6px}
.ph{display:inline-block;background:var(--line);border-radius:8px;flex:none}.fr{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);padding:4px 10px 4px 4px}
.flist{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}.flist .fr{border:1px solid var(--line);border-radius:12px;background:var(--panel)}.flist .fr:hover,.it:hover{border-color:var(--g)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(116px,1fr));gap:10px}.it{border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;font-size:12.5px;background:var(--panel);color:var(--ink);text-decoration:none;display:block;overflow:hidden}.it div{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:600;margin:4px 0;min-height:2.6em;line-height:1.3}.big{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.it .pill{font-size:11.5px;padding:1px 8px}
.rb{display:inline-flex;align-items:center;gap:3px;font-weight:700;color:var(--ink)}.rbi{height:1.05em;width:auto;vertical-align:-.17em}
.path{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid var(--line)}.pn{display:flex;flex-direction:column;align-items:center;text-align:center;width:112px;text-decoration:none;color:var(--ink);font-size:13px}.pn b{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.arr{font-size:28px;color:var(--g)}
.live{display:flex;gap:10px;align-items:center}@keyframes pl{50%{opacity:.35}}.live .dot{width:10px;height:10px;border-radius:50%;background:var(--g);animation:pl 1s infinite;flex:none}
.av{position:relative;display:inline-block;flex:none}.st{position:absolute;right:-1px;bottom:-1px;width:14px;height:14px;border-radius:50%;border:2px solid var(--panel);background:#9aa4b2}.st.on{background:var(--ok)}.st.game{background:#2f80ed}.ok{color:var(--ok)}.fr[data-fv]{cursor:pointer}.fr[data-fv]:hover{border-color:var(--g)}
.frow{display:flex;gap:8px;margin-top:6px}.ft{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center;padding:8px 4px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-size:12.5px}.ft b,.ft span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lk{background:none;border:0;color:var(--gd);cursor:pointer;font:inherit;font-weight:600;padding:0}.lk:hover{text-decoration:underline}
.dh{position:sticky;top:0;z-index:3;background:var(--bg);padding:14px 16px 0;border-bottom:1px solid var(--line)}.dtop{display:flex;align-items:center;gap:10px}.dn{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}.dn b{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;font-size:16px;display:grid;place-items:center;flex:none;padding:0}.ib:hover{background:var(--tint);color:var(--gd)}
.dsub{display:flex;align-items:center;gap:10px;margin-top:8px}.dsub .lk{margin-left:auto;background:var(--tint);padding:4px 12px;border-radius:99px}
.tabs{margin:10px -16px 0;padding:0 12px;display:flex;gap:0;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;border-bottom:3px solid transparent;background:none;border-radius:0;padding:10px 13px;color:var(--mut);font-weight:600}.tabs button:hover{color:var(--ink)}.tabs button.on{background:none;color:var(--g);border-bottom-color:var(--g)}
.db{padding:14px 16px 24px}#ff{border-radius:99px;padding:6px 12px}
.flist .fr{line-height:1.3;padding:9px 10px}.flist .fr>span:last-child{min-width:0;flex:1}.flist .fr>span:last-child>*{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}.flist .fr>span:last-child>b{font-size:14.5px}.flist .fr br{display:none}
@media(max-width:640px){header{padding:0 12px;gap:8px}header nav button{padding:0 8px}.kv{grid-template-columns:90px 1fr}}
@media(prefers-reduced-motion:reduce){#dr,.card{transition:none}.live .dot{animation:none}}
</style></head><body>

async function names(list,cb){const need=list.filter(f=>!f.display&&!f.nm);if(!need.length)return;for(let i=0;i<need.length;i+=100){const c=need.slice(i,i+100),r=await api('users','/v1/users',{userIds:c.map(f=>f.id),excludeBannedUsers:false});
 if(r.ok)(r.j.data||[]).forEach(u=>{const f=c.find(z=>z.id===u.id);if(f){f.display=u.displayName;f.name=u.name}});c.forEach(f=>{f.nm=1;f.display=f.display||f.name})}save();cb&&cb()}
async function thumbs(kind,ids,cb){const need=[...new Set(ids)].filter(i=>i&&!((kind+i) in IMG));if(!need.length)return;
 const P={u:c=>'/v1/users/avatar-headshot?userIds='+c+'&size=150x150&format=Png',p:c=>'/v1/game-passes?gamePassIds='+c+'&size=150x150&format=Png',a:c=>'/v1/assets?assetIds='+c+'&size=150x150&format=Png',g:c=>'/v1/games/icons?universeIds='+c+'&size=150x150&format=Png',c:c=>'/v1/groups/icons?groupIds='+c+'&size=150x150&format=Png'}[kind];
 for(let i=0;i<need.length;i+=50){const c=need.slice(i,i+50);c.forEach(x=>IMG[kind+x]='');let ids=c;for(let t=0;t<2&&ids.length;t++){if(t)await sleep(1500);const r=await api('thumbnails',P(ids.join(',')));if(r.ok)(r.j.data||[]).forEach(q=>{if(q.imageUrl)IMG[kind+q.targetId]=q.imageUrl});ids=ids.filter(x=>!IMG[kind+x])}}
 cb&&cb()}

async function lookup(a){const id=a.id;
 const[u,pr,fr,th]=await Promise.all([api('users','/v1/users/'+id),api('presence','/v1/presence/users',{userIds:[+id]}),api('friends','/v1/users/'+id+'/friends'),api('thumbnails','/v1/users/avatar-headshot?userIds='+id+'&size=150x150&format=Png')]);
 if(!u.ok)throw Error('Roblox returned HTTP '+(u.status||'(no connection - is the server running?)'));
 const p=pr.ok&&pr.j.userPresences?pr.j.userPresences[0]:null; return{banned:!!u.j.isBanned,name:u.j.name,display:u.j.displayName,created:u.j.created,desc:u.j.description||'',
  pres:p?['Offline','Online','In game','In Studio'][p.userPresenceType]||'Unknown':null,lastOnline:p&&p.lastOnline,
  friends:fr.ok?(fr.j.data||[]).map(f=>({id:f.id,name:f.name,display:f.displayName})):null,img:th.ok&&th.j.data&&th.j.data[0]?th.j.data[0].imageUrl:'',at:new Date().toISOString()}}
function notify(m){S.alerts.unshift({t:new Date().toLocaleString(),m});S.alerts=S.alerts.slice(0,50);if('Notification' in window&&Notification.permission==='granted')new Notification('Ro-Viewer',{body:m})}
async function check(a){try{const d=await lookup(a),was=a.d&&a.d.banned;if(a.d&&was!==d.banned)notify(d.banned?`${a.name} is now BANNED (Roblox does not publish the reason).`:`${a.name} is no longer banned.`);a.d=d;a.err=''}catch(e){a.err=e.message}save()}
async function checkAll(){for(const a of S.accs){await check(a);if(tab===1)tracker();await sleep(300)}}
const schedule=()=>{clearInterval(timer);if(S.every>0)timer=setInterval(checkAll,S.every*6e4)};

 const kf=$('#kf');if(kf)kf.onchange=e=>{x.invf=e.target.value;x.invN=96;render('Inventory')};const mr=$('#mr');if(mr)mr.onclick=()=>{x.invN=(x.invN||96)+96;render('Inventory')};
 want.forEach(([k,ids])=>thumbs(k,ids,()=>cur&&window.tb===tb&&render(tb)))}
// ----- friend finder (live bidirectional search, like the Connections Finder game) -----
let stop=false;const NODE={},FC={};let reqs=0,priv=0,errs=0,skipped=0;const bad=n=>n<=0||(NODE[n]&&NODE[n].bad);
function finder(){$('#m').innerHTML=`<div class="panel"><b>Connections Finder</b><div class="mut sm">Traces the chain of friends between you and any player, searching from both ends at once and showing progress live. Uses public friends lists; private lists are skipped.</div>
 <div class="row" style="margin-top:8px"><input id="me" placeholder="Your username" value="${esc(S.me)}"><input id="tg" placeholder="Target username(s), comma separated" value="${esc(S.tg)}"></div>
 <div class="row" style="margin-top:8px"><select id="bg" aria-label="Request budget">${[[300,'Quick (300 requests)'],[1000,'Normal (1,000)'],[3000,'Deep (3,000)'],[10000,'Max (10,000)'],[0,'Unlimited (until found or Stop)']].map(([v,l])=>`<option value="${v}" ${v===(S.bg===undefined?1000:S.bg)?'selected':''}>${l}</option>`).join('')}</select><button class="b" id="go">Start search</button><button class="b o" id="st">Stop</button></div>
 <label class="chk"><input type="checkbox" id="sk" ${S.skip!==false?'checked':''}> Skip unavailable users (banned, deleted or hidden accounts) so they are not scanned or used in paths</label></div>
 <div class="panel" style="margin-top:14px"><div id="lv" class="mut">Idle.</div><div id="res"></div></div>`;$('#st').onclick=()=>stop=true;$('#go').onclick=run}
const uid=async n=>{const r=await api('users','/v1/usernames/users',{usernames:[n],excludeBannedUsers:false});const u=r.ok&&r.j.data&&r.j.data[0];if(u)NODE[u.id]=NODE[u.id]||{id:u.id,name:u.name,display:u.displayName};return u||null};
async function resolve(ids){ids.filter(i=>i<=0).forEach(i=>NODE[i]={id:i,name:'unavailable',display:'Unavailable user',bad:1});const need=ids.filter(i=>i>0&&!(NODE[i]&&NODE[i].name));for(let k=0;k<need.length;k+=100){const c=need.slice(k,k+100),r=await api('users','/v1/users',{userIds:c,excludeBannedUsers:false});
 if(r.ok)(r.j.data||[]).forEach(u=>NODE[u.id]={id:u.id,name:u.name,display:u.displayName});c.forEach(i=>{if(!NODE[i]||!NODE[i].name)NODE[i]={id:i,name:'user'+i,display:'User '+i}})}}
async function fl(id){if(id in FC)return FC[id];reqs++;const r=await api('friends','/v1/users/'+id+'/friends');await sleep(90);
 if(r.ok){const L=r.j.data||[];L.forEach(f=>NODE[f.id]=NODE[f.id]||{id:f.id,name:f.name,display:f.displayName,bad:!!(f.isBanned||f.isDeleted)});return FC[id]={l:L.map(f=>f.id)}}
 if(r.status===403||r.status===404||r.status===400)priv++;else errs++;return FC[id]={l:null,s:r.status}}
const build=(P,m)=>{const a=[];let c=m;while(c){a.unshift(c);c=P[0][c]||0}c=P[1][m];while(c){a.push(c);c=P[1][c]||0}return a};
async function search(me,t,budget,ui){if(me.id===t.id)return[me.id];const P=[{[me.id]:0},{[t.id]:0}];let F=[[me.id],[t.id]],dp=[0,0];const r0=reqs;
 while((F[0].length||F[1].length)&&!stop){const s=F[0].length&&(!F[1].length||F[0].length<=F[1].length)?0:1,o=1-s,next=[];dp[s]++;let i=0;await resolve(F[s]);
  for(const u of F[s]){if(stop)return null;if(budget&&reqs-r0>=budget)return{limit:1};ui(s,dp[s],++i,F[s].length,u,Object.keys(P[0]).length+Object.keys(P[1]).length);
   const r=await fl(u);if(!r.l)continue;for(const n of r.l){if(S.skip!==false&&bad(n)){skipped++;continue}if(n in P[s])continue;P[s][n]=u;if(n in P[o])return build(P,n);next.push(n)}}
  F[s]=next}return null}
async function run(){stop=false;S.me=$('#me').value.trim();S.tg=$('#tg').value;S.bg=+$('#bg').value;save();const lv=$('#lv'),res=$('#res');res.innerHTML='';priv=errs=skipped=0;S.skip=$('#sk').checked;
 const tn=S.tg.split(',').map(x=>x.trim()).filter(Boolean);if(!S.me||!tn.length)return lv.textContent='Enter your username and at least one target.';
 lv.textContent='Looking up usernames...';const me=await uid(S.me);if(!me)return lv.innerHTML='<span class="bad">Your username was not found (or Roblox is unreachable).</span>';
 const first=await fl(me.id);if(!first.l)return lv.innerHTML=`<span class="bad">Your friends list could not be read (HTTP ${first.s}). It may be private or Roblox is rate-limiting.</span>`;
 for(const n of tn){if(stop)break;const t=await uid(n);if(!t){res.insertAdjacentHTML('beforeend',`<div class="path bad">"${esc(n)}" not found.</div>`);continue}
  const r0=reqs,ui=(s,d,i,n2,u,k)=>{const x=NODE[u]||{};lv.innerHTML=`<div class="live"><span class="dot"></span><span>Searching <b>${esc(t.name)}</b> &middot; from ${s?'target':'you'}, step ${d} &middot; scanning <b>${esc(x.display||x.name||'user')}</b> (${i}/${n2}) &middot; ${reqs-r0} requests &middot; ${k} users reached</span></div>`};
  const path=await search(me,t,S.bg,ui);
  if(Array.isArray(path)){await resolve(path);await thumbs('u',path,null);res.insertAdjacentHTML('beforeend',`<div class="path">${path.map((id,i)=>{const x=NODE[id]||{id,name:id};return(i?'<span class="arr">&rsaquo;</span>':'')+`<a class="pn" href="https://www.roblox.com/users/${+id}/profile" target="_blank" rel="noopener">${pic('u',id,64)}<b>${esc(x.display||x.name)}</b><span class="mut">@${esc(x.name)}</span></a>`}).join('')}<span class="pill">${path.length-1} step${path.length>2?'s':''}</span></div>`)}
  else res.insertAdjacentHTML('beforeend',`<div class="path"><span class="mut">${stop?'Stopped before finding a path to ':path&&path.limit?'Request budget reached before finding a path to ':'No path found to '}${esc(t.name)}.${path&&path.limit?' Try a deeper budget.':''}</span></div>`)}
 lv.innerHTML=`${stop?'Stopped.':'Done.'} ${reqs} requests total, ${priv} private lists skipped, ${skipped} unavailable users skipped, ${errs} errors${errs?' (Roblox may be rate-limiting; try again later or use a smaller budget)':''}.`}
const R=(r,note)=>({ok:r.ok,status:r.status,note:r.ok?note:'HTTP '+r.status+' '+msg(r)});
function diagPage(){$('#m').innerHTML=`<div class="panel"><b>Diagnostics</b><div class="mut sm">Tests every Roblox endpoint Ro-Viewer uses and shows what came back. If something is broken, run this and send me the copied report.</div><div class="row" style="margin-top:8px"><input id="dn" placeholder="Roblox username to test" value="${esc((S.accs[0]&&S.accs[0].name)||S.me||'')}"><button class="b" id="dg">Run tests</button><button class="b o" id="dc">Copy report</button></div></div><div class="panel" style="margin-top:14px" id="dres"><span class="mut">Not run yet.</span></div>`;
 $('#dg').onclick=()=>diag($('#dn').value.trim());$('#dc').onclick=()=>navigator.clipboard.writeText(window.DREP||'').then(()=>toast('Report copied'),()=>toast('Copy failed'))}
async function diag(name){if(!name)return toast('Enter a username');const rows=[],out=$('#dres');out.textContent='Running...';
 const draw=()=>{out.innerHTML=`<table><tr><th>Test<th>Result<th>Details</tr>${rows.map(r=>`<tr><td>${esc(r.n)}<td class="${r.ok?'ok':'bad'}">${r.ok?'PASS':'FAIL'} ${esc(r.st)}<td class="sm">${esc(r.note)}</tr>`).join('')}</table>`;window.DREP=rows.map(r=>`${r.ok?'PASS':'FAIL'} [${r.st}] ${r.n}: ${r.note}`).join('\n')};
 const T=async(n,f)=>{try{const r=await f();rows.push({n,ok:r.ok,st:r.status??'',note:r.note||''})}catch(e){rows.push({n,ok:false,st:'',note:e.message})}draw()};let id=0,A=[];
 await T('Local server + data.json',async()=>{const r=await fetch('/api/data');return{ok:r.ok,status:r.status,note:'ok'}});
 await T('Find user',async()=>{const r=await api('users','/v1/usernames/users',{usernames:[name],excludeBannedUsers:false});id=(r.j.data&&r.j.data[0]&&r.j.data[0].id)||0;return R(r,id?'id '+id:'username not found')});if(!id)return;
 await T('Profile',async()=>{const r=await api('users','/v1/users/'+id);return R(r,'name '+r.j.name+', isBanned '+r.j.isBanned)});
 await T('Presence',async()=>{const r=await api('presence','/v1/presence/users',{userIds:[id]});const p=r.j.userPresences&&r.j.userPresences[0];return R(r,p?'type '+p.userPresenceType:'no data')});
 await T('Friends list',async()=>{const r=await api('friends','/v1/users/'+id+'/friends');const L=r.j.data||[];return R(r,L.length+' friends; fields: '+Object.keys(L[0]||{}).join(','))});
 await T('Headshot image',async()=>{const r=await api('thumbnails','/v1/users/avatar-headshot?userIds='+id+'&size=150x150&format=Png');const t=r.j.data&&r.j.data[0];return R(r,'state '+(t&&t.state))});
 await T('Currently wearing',async()=>{const r=await api('avatar','/v1/users/'+id+'/avatar');A=(r.j.assets||[]).map(a=>a.id);return R(r,A.length+' items')});
 await T('Catalog details (sale / limited)',async()=>{if(!A.length)return{ok:false,status:'',note:'no worn items to test'};const r=await api('catalog','/v1/catalog/items/details',{items:A.slice(0,5).map(n=>({itemType:'Asset',id:n}))});return R(r,(r.j.data||[]).map(q=>q.name+': '+q.priceStatus+' / off='+q.isOffSale+' / '+((q.itemRestrictions||[]).join('+')||'none')+' / price '+q.price).join(' || '))});
 await T('Collectibles inventory',async()=>{const r=await api('inventory','/v1/users/'+id+'/assets/collectibles?limit=10');const L=r.j.data||[];return R(r,L.length+' returned; fields: '+Object.keys(L[0]||{}).join(','))});
 await T('Other inventory (Hat)',async()=>{const r=await api('inventory','/v2/users/'+id+'/inventory?assetTypes=Hat&limit=10');const L=r.j.data||[];return R(r,L.length+' returned; fields: '+Object.keys(L[0]||{}).join(','))});
 await T('Game passes',async()=>{const r=await api('apis','/game-passes/v1/users/'+id+'/game-passes?count=10');const L=r.j.gamePasses||r.j.data||[];return R(r,L.length+' returned; fields: '+Object.keys(L[0]||{}).join(','))});
 await T('Favorite games',async()=>{const r=await api('games','/v2/users/'+id+'/favorite/games?limit=10');return R(r,(r.j.data||[]).length+' returned')});
 await T('Communities',async()=>{const r=await api('groups','/v2/users/'+id+'/groups/roles');return R(r,(r.j.data||[]).length+' returned')});
 out.insertAdjacentHTML('afterbegin','<p class="mut sm">Finished. Press "Copy report" and send it to me if anything shows FAIL.</p>')}
(async()=>{try{Object.assign(S,await(await fetch('/api/data')).json())}catch{toast('Server not reachable')}setTheme();show(1);schedule();if(S.accs.some(a=>!a.d))checkAll()})();
</script></body></html>
